<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#1a237e">VMC live mocap — data flow</text>
  <text x="20" y="56" font-size="13" fill="#546e7a">One OSC sender on one address:port can drive many rigs. Each rig has its own anim node that pulls from the shared cache every evaluation.</text>

  <!-- Sender -->
  <rect x="20" y="92" width="170" height="78" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="105" y="124" font-size="14" font-weight="700" fill="#0d47a1" text-anchor="middle">XR Animator</text>
  <text x="105" y="144" font-size="12" fill="#37474f" text-anchor="middle">/ VMC sender</text>
  <text x="105" y="161" font-size="11" fill="#78909c" text-anchor="middle">(VSeeFace, 3tene…)</text>

  <!-- OSC server -->
  <rect x="250" y="92" width="180" height="78" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="340" y="120" font-size="14" font-weight="700" fill="#4527a0" text-anchor="middle">UVrmVMCObject</text>
  <text x="340" y="139" font-size="12" fill="#37474f" text-anchor="middle">OSC server</text>
  <text x="340" y="157" font-size="11" fill="#78909c" text-anchor="middle">one per address:port</text>

  <!-- Subsystem -->
  <rect x="490" y="92" width="190" height="78" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="585" y="120" font-size="14" font-weight="700" fill="#1b5e20" text-anchor="middle">UVRM4U_VMCSubsystem</text>
  <text x="585" y="139" font-size="12" fill="#37474f" text-anchor="middle">server list + cache</text>
  <text x="585" y="157" font-size="11" fill="#78909c" text-anchor="middle">+ node registry</text>

  <!-- Anim node A -->
  <rect x="740" y="62" width="180" height="70" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="830" y="90" font-size="13" font-weight="700" fill="#e65100" text-anchor="middle">FAnimNode_VrmVMC</text>
  <text x="830" y="108" font-size="11" fill="#37474f" text-anchor="middle">on Rig A</text>
  <text x="830" y="124" font-size="11" fill="#78909c" text-anchor="middle">(anim worker thread)</text>

  <!-- Anim node B -->
  <rect x="740" y="168" width="180" height="70" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="830" y="196" font-size="13" font-weight="700" fill="#e65100" text-anchor="middle">FAnimNode_VrmVMC</text>
  <text x="830" y="214" font-size="11" fill="#37474f" text-anchor="middle">on Rig B</text>
  <text x="830" y="230" font-size="11" fill="#78909c" text-anchor="middle">(same endpoint)</text>

  <!-- arrows row -->
  <line x1="190" y1="131" x2="246" y2="131" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="123" font-size="10.5" fill="#455a64" text-anchor="middle">OSC</text>
  <text x="218" y="146" font-size="10.5" fill="#455a64" text-anchor="middle">UDP :39539</text>

  <line x1="430" y1="131" x2="486" y2="131" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="458" y="124" font-size="10" fill="#455a64" text-anchor="middle">buffer</text>
  <text x="458" y="146" font-size="10" fill="#455a64" text-anchor="middle">→ cache</text>

  <line x1="680" y1="115" x2="736" y2="97" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="150" x2="736" y2="200" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="250" font-size="10.5" fill="#455a64">CopyVMCData() — pulled per evaluation</text>

  <!-- Rigs -->
  <rect x="740" y="300" width="180" height="58" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="830" y="326" font-size="13" font-weight="700" fill="#880e4f" text-anchor="middle">Rig A (skeletal mesh)</text>
  <text x="830" y="345" font-size="11" fill="#78909c" text-anchor="middle">MetaHuman / Mixamo / VRoid…</text>

  <rect x="740" y="378" width="180" height="58" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="830" y="404" font-size="13" font-weight="700" fill="#880e4f" text-anchor="middle">Rig B (skeletal mesh)</text>
  <text x="830" y="423" font-size="11" fill="#78909c" text-anchor="middle">driven by the same sender</text>

  <line x1="830" y1="132" x2="830" y2="296" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="238" x2="830" y2="374" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845" y="270" font-size="10.5" fill="#455a64">apply to bones</text>

  <!-- Debug panel note -->
  <rect x="490" y="300" width="220" height="100" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="600" y="324" font-size="12.5" font-weight="700" fill="#37474f" text-anchor="middle">VMC Debug panel (editor)</text>
  <text x="600" y="344" font-size="11" fill="#546e7a" text-anchor="middle">reads server + rig lists,</text>
  <text x="600" y="360" font-size="11" fill="#546e7a" text-anchor="middle">live bone/curve values,</text>
  <text x="600" y="376" font-size="11" fill="#546e7a" text-anchor="middle">writes per-bone overrides</text>
  <text x="600" y="392" font-size="11" fill="#546e7a" text-anchor="middle">via the Blueprint library</text>
  <line x1="585" y1="170" x2="585" y2="296" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
