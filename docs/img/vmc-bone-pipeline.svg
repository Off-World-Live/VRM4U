<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#1a237e">Per-bone evaluation pipeline (one bone, one frame)</text>
  <text x="24" y="58" font-size="13" fill="#546e7a">Where each system acts. Settings on the node are baked once at init; overrides are live runtime state from the panel / Blueprint.</text>

  <!-- Input -->
  <rect x="60" y="86" width="200" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="160" y="110" font-size="13" font-weight="700" fill="#0d47a1" text-anchor="middle">incoming VMC rotation</text>
  <text x="160" y="129" font-size="12" fill="#37474f" text-anchor="middle">r_vmc</text>

  <!-- Mask -->
  <polygon points="160,170 300,205 160,240 20,205" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="160" y="200" font-size="13" font-weight="700" fill="#b71c1c" text-anchor="middle">Masked?</text>
  <text x="160" y="218" font-size="11" fill="#546e7a" text-anchor="middle">SetBoneMasked</text>
  <line x1="160" y1="142" x2="160" y2="168" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- mask yes -->
  <rect x="330" y="178" width="240" height="54" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <text x="450" y="200" font-size="12.5" font-weight="700" fill="#424242" text-anchor="middle">skip bone entirely</text>
  <text x="450" y="218" font-size="11" fill="#757575" text-anchor="middle">upstream pose kept, no output</text>
  <line x1="300" y1="205" x2="326" y2="205" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="313" y="197" font-size="11" font-weight="700" fill="#c62828" text-anchor="middle">yes</text>

  <text x="172" y="262" font-size="11" font-weight="700" fill="#2e7d32">no</text>

  <!-- Pre-rebase -->
  <rect x="60" y="276" width="200" height="72" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="160" y="300" font-size="13" font-weight="700" fill="#f57f17" text-anchor="middle">Pre-rebase override?</text>
  <text x="160" y="319" font-size="11" fill="#546e7a" text-anchor="middle">if set, REPLACE r_vmc</text>
  <text x="160" y="336" font-size="11" fill="#546e7a" text-anchor="middle">with a fixed rotation</text>
  <line x1="160" y1="240" x2="160" y2="274" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Rebase -->
  <rect x="60" y="382" width="380" height="96" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="250" y="408" font-size="14" font-weight="700" fill="#1b5e20" text-anchor="middle">Rebase onto this rig's bind pose</text>
  <text x="250" y="436" font-size="15" fill="#1b5e20" text-anchor="middle" font-family="Consolas, monospace">C = r_vmc · r_refg</text>
  <text x="250" y="462" font-size="11.5" fill="#546e7a" text-anchor="middle">the VMC rotation applied as a delta onto this rig's bind rotation</text>
  <line x1="160" y1="348" x2="160" y2="380" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Post-rebase -->
  <rect x="60" y="500" width="200" height="48" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="160" y="521" font-size="13" font-weight="700" fill="#f57f17" text-anchor="middle">Post-rebase override?</text>
  <text x="160" y="539" font-size="11" fill="#546e7a" text-anchor="middle">if set, REPLACE the whole result (bypasses the rebase)</text>
  <line x1="160" y1="478" x2="160" y2="498" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="500" y="500" width="200" height="48" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="600" y="521" font-size="13" font-weight="700" fill="#880e4f" text-anchor="middle">final bone rotation</text>
  <text x="600" y="539" font-size="11" fill="#546e7a" text-anchor="middle">written to the pose</text>
  <line x1="260" y1="524" x2="496" y2="524" stroke="#37474f" stroke-width="2" marker-end="url(#arr)"/>
</svg>
